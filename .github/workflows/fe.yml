name: FE CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'feature/**', 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: fe-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mynotewebapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.1'
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn lint
      - name: Unit tests (empty suites fail)
        run: |
          mkdir -p reports
          node --test --test-reporter=tap tests/*.test.js | tee reports/unit.tap
          grep -Eq '^# tests [1-9][0-9]*$' reports/unit.tap
        shell: bash
      - run: yarn build
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: mynotewebapp
          load: true
          tags: notesweb-fe:ci
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=fe-ci
          cache-to: type=gha,mode=max,scope=fe-ci
      - name: Image smoke with isolated mock API
        env:
          REVISION: ${{ github.sha }}
        run: node scripts/ci/smoke-image.mjs notesweb-fe:ci "$REVISION" | tee reports/image.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: validation-reports
          path: mynotewebapp/reports/
          retention-days: 14

  firefox:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: mynotewebapp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.1'
      - run: corepack enable && corepack prepare yarn@1.22.22 --activate
      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn playwright install --with-deps firefox
      - name: Firefox auth + notes focus regression (missing browser or assertions fail CI)
        env:
          AUTH_TEST_BROWSER: firefox
        run: |
          mkdir -p reports
          node --test --test-reporter=tap tests/authRateLimit.browser.test.js tests/notesFocus.browser.test.js | tee reports/firefox.tap
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: firefox-reports
          path: mynotewebapp/reports/
          retention-days: 14

  publish:
    needs: [validate, firefox]
    if: >-
      github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    environment: ProductFE
    env:
      IMAGE: ghcr.io/nntn32/notesweb-fe
    permissions:
      contents: read
      packages: write
      pull-requests: read
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require merged PR and current main before publication
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" > "$RUNNER_TEMP/prs.json"
          jq -e --arg sha "$GITHUB_SHA" --arg repo "$GITHUB_REPOSITORY" \
            'any(.[]; .merged_at != null and .base.ref == "main" and .base.repo.full_name == $repo and .merge_commit_sha == $sha)' "$RUNNER_TEMP/prs.json"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.1'
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish candidate (never latest here)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: mynotewebapp
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          build-args: REVISION=${{ github.sha }}
          cache-from: type=gha,scope=fe-release
          cache-to: type=gha,mode=max,scope=fe-release
      - name: Pull and smoke the exact published digest on both architectures
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p reports
          docker buildx imagetools inspect --raw "$IMAGE@$DIGEST" > reports/manifest.json
          for platform in linux/amd64 linux/arm64; do
            architecture="${platform#linux/}"
            platform_digest=$(jq -er --arg arch "$architecture" \
              '.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch) | .digest' reports/manifest.json)
            docker pull --platform "$platform" "$IMAGE@$platform_digest"
            node mynotewebapp/scripts/ci/smoke-image.mjs "$IMAGE@$platform_digest" "$GITHUB_SHA" "$platform" | tee "reports/smoke-$architecture.json"
          done
      - name: Record tested release
        id: release
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          jq -n --arg sha "$GITHUB_SHA" --arg image "$IMAGE@$DIGEST" --arg run "$GITHUB_RUN_ID" \
            '{revision:$sha,image:$image,runId:$run,platforms:["linux/amd64","linux/arm64"]}' > reports/release.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-reports
          path: reports/
          retention-days: 30

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment: ProductFE
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/nntn32/notesweb-fe
    concurrency:
      group: fe-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.15.1'
      - name: Reject superseded release before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')" = "$GITHUB_SHA"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve the last verified digest for rollback
        id: previous
        run: |
          # latest only ever points at a digest that passed this job; absent on the first CapRover release.
          if digest=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{ .Manifest.Digest }}' 2>/dev/null); then
            echo "image=$IMAGE@$digest" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy tested digest to CapRover and verify public revision
        env:
          CAPROVER_APP_TOKEN: ${{ secrets.CAPROVER_APP_TOKEN }}
          RELEASE_IMAGE: ghcr.io/nntn32/notesweb-fe@${{ needs.publish.outputs.digest }}
          PREVIOUS_IMAGE: ${{ steps.previous.outputs.image }}
        run: node mynotewebapp/scripts/ci/deploy.mjs
      - name: Promote successful production digest to latest
        env:
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: docker buildx imagetools create --tag "$IMAGE:latest" "$IMAGE@$DIGEST"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: deployment-report
          path: deployment.json
          retention-days: 90

  notify:
    # One Discord message (#ci_fe-alert) per run, green or red. Fork/Dependabot runs get no secret and skip.
    needs: [validate, firefox, publish, deploy]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          sparse-checkout: mynotewebapp/scripts/ci
      - name: Post CI result to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_CI_WEBHOOK }}
          RESULTS: ${{ toJSON(needs) }}
          TITLE: ${{ github.event.pull_request.title || github.event.head_commit.message }}
          REF: ${{ github.head_ref || github.ref_name }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node mynotewebapp/scripts/ci/notify-discord.mjs
